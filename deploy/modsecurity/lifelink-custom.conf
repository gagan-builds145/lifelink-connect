# LifeLink ModSecurity tuning (OWASP CRS 4.x)
#
# Include AFTER crs-setup.conf and BEFORE crs-rules.conf in
# /etc/nginx/modsec/main.conf:
#
#   Include /etc/nginx/modsec/modsecurity.conf
#   Include /etc/nginx/modsec/crs-setup.conf
#   Include /etc/nginx/modsec/lifelink-custom.conf
#   Include /etc/nginx/modsec/crs-rules/*.conf
#
# Start in DetectionOnly, review the audit log for at least 72 hours of real
# hospital traffic, then switch SecRuleEngine to On.

SecRuleEngine DetectionOnly
SecRequestBodyAccess On
SecRequestBodyLimit 6291456
SecRequestBodyNoFilesLimit 131072
SecRequestBodyInMemoryLimit 131072
SecResponseBodyAccess Off
SecPcreMatchLimit 100000
SecPcreMatchLimitRecursion 100000

# ---------------------------------------------------------------------------
# SQL injection / XSS / generic attack blocking (CRS handles most of this).
# These explicit rules cover JSON API bodies, where CRS paranoia level 1 is
# sometimes conservative.
# ---------------------------------------------------------------------------
SecRule REQUEST_HEADERS:Content-Type "@rx ^application/json" \
    "id:1000001,phase:1,pass,nolog,ctl:requestBodyProcessor=JSON"

SecRule REQUEST_BODY "@rx (?i)(\bunion\b\s+\bselect\b|\bor\b\s+1\s*=\s*1|sleep\s*\(|benchmark\s*\(|information_schema|pg_catalog|;\s*drop\s+table)" \
    "id:1000010,phase:2,deny,status:403,log,msg:'LifeLink WAF: SQL injection pattern in request body',tag:'attack-sqli'"

SecRule REQUEST_URI|ARGS|REQUEST_BODY "@rx (?i)(<script[^>]*>|javascript\s*:|onerror\s*=|onload\s*=|data\s*:\s*text/html|document\.cookie|<iframe)" \
    "id:1000011,phase:2,deny,status:403,log,msg:'LifeLink WAF: XSS pattern blocked',tag:'attack-xss'"

SecRule REQUEST_URI|ARGS "@rx (?i)(\.\./\.\./|/etc/passwd|/proc/self/|php://|expect://)" \
    "id:1000012,phase:1,deny,status:403,log,msg:'LifeLink WAF: path traversal / file inclusion attempt',tag:'attack-lfi'"

SecRule REQUEST_METHOD "@rx ^(TRACE|TRACK|CONNECT)$" \
    "id:1000013,phase:1,deny,status:405,log,msg:'LifeLink WAF: unsupported HTTP method'"

# ---------------------------------------------------------------------------
# Surgical exclusions: clinical free text legitimately contains semicolons,
# comparison operators and words like "select". Keep exclusions narrow and
# path-scoped. Re-tune with real audit data before enabling blocking.
# ---------------------------------------------------------------------------
# Request reasons / notes / clinical free text on the request-creation path.
SecRuleUpdateTargetById 942100 "!ARGS:reason"
SecRuleUpdateTargetById 942100 "!ARGS:note"
SecRuleUpdateTargetById 942100 "!ARGS:doctorContact"
SecRuleUpdateTargetById 942100 "!ARGS:patientRef"
# Legacy CRS rule IDs (2.x compatibility) if the ruleset still ships them.
SecRuleUpdateTargetById 981172 "!ARGS:reason"
SecRuleUpdateTargetById 981173 "!ARGS:reason"
# XSS rules on fields that are rendered as plain text, never as HTML.
SecRuleUpdateTargetById 941100 "!ARGS:reason"
SecRuleUpdateTargetById 941100 "!ARGS:note"
SecRuleUpdateTargetById 941110 "!ARGS:reason"
SecRuleUpdateTargetById 941110 "!ARGS:note"

# Never inspect the health endpoints; they carry no attacker-controlled body.
SecRule REQUEST_URI "@streq /health" "id:1000020,phase:1,pass,nolog,ctl:ruleEngine=Off"
