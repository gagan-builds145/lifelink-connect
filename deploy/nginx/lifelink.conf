# LifeLink edge: nginx reverse proxy with ModSecurity + OWASP CRS
#
# This file is a deployment blueprint. It is NOT active in this repository's
# preview environment; the app is served by Vite and the backend by Convex
# Cloud, so the WAF must be deployed in front of BOTH the static site and the
# API hostname. See docs/waf-deployment.md for the step-by-step checklist.
#
# Domains to protect:
#   app.example.org      -> static SPA (Vite build output)
#   api.example.org      -> Convex HTTP actions / auth endpoints
#
# Requires: nginx >= 1.24, libmodsecurity3, modsecurity-nginx connector,
# OWASP CRS >= 4.0 (owasp-crs package or git checkout).

# ---------------------------------------------------------------------------
# Rate-limit zones (shared memory). Tune with real hospital traffic.
# ---------------------------------------------------------------------------
limit_req_zone  $binary_remote_addr zone=general:20m  rate=60r/m;
limit_req_zone  $binary_remote_addr zone=auth:10m     rate=10r/m;
limit_req_zone  $binary_remote_addr zone=otp:10m      rate=5r/m;
limit_req_zone  $binary_remote_addr zone=upload:10m   rate=10r/m;
limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;

# Reject oversized bodies at the edge before they reach the app.
client_max_body_size 6m;          # 5 MB document cap + multipart overhead
large_client_header_buffers 4 8k;
client_body_timeout 15s;
client_header_timeout 10s;
send_timeout 20s;

# ModSecurity engine + CRS includes
modsecurity on;
modsecurity_rules_file /etc/nginx/modsec/main.conf;

upstream lifelink_app {
    server 127.0.0.1:4173;        # `vite preview` / static container port
    keepalive 32;
}
upstream lifelink_api {
    server 127.0.0.1:3210;        # Convex self-hosted backend (if self-hosted)
    keepalive 32;
}

server {
    listen 443 ssl http2;
    server_name app.example.org;

    ssl_certificate     /etc/letsencrypt/live/app.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.example.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # -----------------------------------------------------------------------
    # Security headers. The SPA also ships a baseline CSP meta tag; this header
    # is authoritative in production and is intentionally stricter.
    # -----------------------------------------------------------------------
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data: blob: https:; font-src 'self' https://fonts.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; script-src 'self' https://*.convex.cloud https://*.convex.site; connect-src 'self' https://*.convex.cloud wss://*.convex.cloud https://*.convex.site https://*.basemaps.cartocdn.com https://*.tile.openstreetmap.org; worker-src 'self' blob:; upgrade-insecure-requests" always;

    limit_conn conn_per_ip 30;

    # Static assets: cache, but never allow source maps or env files.
    location ~* \.(?:js|css|woff2?|png|svg|webp)$ {
        limit_req zone=general burst=120 nodelay;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }
    location ~ /\.(?!well-known) { deny all; }
    location ~* \.(?:map|env|log|bak|sql)$ { deny all; }

    location / {
        limit_req zone=general burst=60 nodelay;
        proxy_pass http://lifelink_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}

server {
    listen 443 ssl http2;
    server_name api.example.org;

    ssl_certificate     /etc/letsencrypt/live/api.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.example.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Cache-Control "no-store" always;

    limit_conn conn_per_ip 30;

    # Authentication endpoints: strict budgets and ModSecurity inspection.
    location ~ ^/(api/auth|otp-gate) {
        limit_req zone=auth burst=20 nodelay;
        proxy_pass http://lifelink_api;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # Code requests are the most abused endpoint: tighter still.
    location = /otp-gate {
        limit_req zone=otp burst=5 nodelay;
        proxy_pass http://lifelink_api;
    }
    # File uploads (Convex storage) get their own budget.
    location ~ ^/api/storage {
        limit_req zone=upload burst=20 nodelay;
        proxy_pass http://lifelink_api;
    }
    location / {
        limit_req zone=general burst=120 nodelay;
        proxy_pass http://lifelink_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Do not expose admin/metrics endpoints from the backend.
    location ~ ^/(metrics|admin/internal) { deny all; }
}

# HTTP -> HTTPS only.
server {
    listen 80;
    server_name app.example.org api.example.org;
    return 301 https://$host$request_uri;
}
