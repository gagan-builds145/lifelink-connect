<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/logo.svg" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#b21f34" />
  <meta
    name="description"
    content="LifeLink — Smart Blood Donation Management & Emergency Blood Matching System. Donate Blood, Save Lives. Every Second Matters."
  />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="LifeLink — Smart Blood Donation & Emergency Matching" />
  <meta
    property="og:description"
    content="A verified network connecting donors, requestors, Red Cross branches and hospitals through one shared blood request and inventory record."
  />
  <meta name="color-scheme" content="light" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <!--
    Baseline Content Security Policy. The deployment edge should also send a
    stricter header-based policy (see deploy/nginx/lifelink.conf and
    docs/security.md). `unsafe-inline` for styles is required by animation and
    chart libraries that set inline transforms; script sources stay on `self`
    plus the Convex deployment.
  -->
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'self'; base-uri 'self'; object-src 'none'; frame-src 'none'; form-action 'self'; img-src 'self' data: blob: https:; font-src 'self' data: https://fonts.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; script-src 'self' 'unsafe-inline' https://*.convex.cloud https://*.convex.site; connect-src 'self' https://*.convex.cloud wss://*.convex.cloud https://*.convex.site https://fonts.googleapis.com https://fonts.gstatic.com https://*.basemaps.cartocdn.com https://*.tile.openstreetmap.org; worker-src 'self' blob:; manifest-src 'self'"
  />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap"
    rel="stylesheet"
  />
  <title>LifeLink — Smart Blood Donation & Emergency Matching</title>
</head>


<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
